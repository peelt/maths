<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2.5 24 24" role="img" aria-label="A Level Maths">
  <!--
    The same mark as src/components/Logo.tsx, redrawn here because a favicon is
    a separate document and cannot reach the app's CSS custom properties. The
    viewBox is cropped tight to the glyph so it fills a 16px tab rather than
    floating in the padding the header version needs.

    Browser chrome is light or dark and the page cannot know which, so the ink
    switches on prefers-color-scheme. The dot switches too: the light theme's
    teal is too dark to read against a dark tab strip.
  -->
  <style>
    .ink { stroke: #414d57 }
    .point { fill: #17595c }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #bac1c8 }
      .point { fill: #3f9ea1 }
    }
  </style>
  <g class="ink" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 24 L11.2 9.8 Q14 5 16.8 9.8 L23 24"/>
    <path d="M8.49 16H19.51"/>
  </g>
  <circle class="point" cx="14" cy="7.4" r="1.9"/>
</svg>
