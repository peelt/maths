<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 0.5 93 93" role="img" aria-label="A Level Maths">
  <!--
    The same mark as src/components/Logo.tsx, redrawn here because a favicon is
    a separate document and cannot reach the app's CSS custom properties. A test
    asserts the two stay identical.

    Two deliberate differences from the header version, both about size rather
    than shape. The viewBox is squared up around the glyph so it fills a 16px
    tab instead of sitting in the header's padding, and the strokes are heavier
    — at 16px the 5.5 weight thins to hairlines and the axes disappear. The
    paths themselves are identical, which is what the test checks.

    The colours switch on prefers-color-scheme: the brand navy is 1.19:1
    against a dark tab strip.
  -->
  <style>
    .ink { fill: #14294f; stroke: #14294f }
    .accent { stroke: #0e8a7c }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ccd3da; stroke: #ccd3da }
      .accent { stroke: #2fb3a2 }
    }
  </style>
  <path class="accent" d="M20 16 Q50 116 80 16" fill="none" stroke-width="7.5" stroke-linecap="round"/>
  <g class="ink" stroke-width="7.5" stroke-linecap="round">
    <path d="M50 86V20"/>
    <path d="M8 75H82"/>
  </g>
  <g class="ink" stroke="none">
    <path d="M50 6 L56.5 21 L43.5 21 Z"/>
    <path d="M96 75 L81 81.5 L81 68.5 Z"/>
  </g>
</svg>
